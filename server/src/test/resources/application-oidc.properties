spring.security.oauth2.client.registration.keycloak.provider=test-keycloak
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.client-id=elaastic
spring.security.oauth2.client.registration.keycloak.client-secret=secret
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.test-keycloak.authorization-uri=http://localhost/authorize
spring.security.oauth2.client.provider.test-keycloak.token-uri=http://localhost/token
spring.security.oauth2.client.provider.test-keycloak.jwk-set-uri=http://localhost/jwks
spring.security.oauth2.client.provider.test-keycloak.user-info-uri=http://localhost/userinfo
spring.security.oauth2.client.provider.test-keycloak.user-name-attribute=sub

spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
