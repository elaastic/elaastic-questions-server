<div th:fragment="utilityGradeVue"
     th:remove="tag"
     xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

    <!--/* script for activating @iframe-resizer that allow us to smoothly integrate the previous iframe within the page layout */-->
    <script src="https://cdn.jsdelivr.net/npm/@iframe-resizer/parent@5.3.2"></script>

    <!--/* iframe allowing to load the <utility-grade> app in a isolated context */-->
    <iframe id="evaluation-reaction-app" class="transparent-iframe" th:src="@{/ui/moderation/evaluation-reaction}"
            width="100%"></iframe>
    <iframe id="evaluation-reaction-app-teacher" class="transparent-iframe"
            th:src="@{/ui/moderation/evaluation-reaction}"
            width="100%"></iframe>
    <iframe id="evaluation-reaction-app-dialog" class="transparent-iframe"
            th:src="@{/ui/moderation/evaluation-reaction}"
            width="100%"></iframe>

    <!--/* Initialize the <confronting-viewpoint app & interact with it */-->
    <script th:inline="javascript">
        const iframe = document.getElementById('evaluation-reaction-app');
        const iframeTeacher = document.getElementById('evaluation-reaction-app-teacher');
        const iframeDialog = document.getElementById('evaluation-reaction-app-dialog');

        const evaluationId = 1;

        /*[- Trigger the app init function on iframe loading -]*/
        iframe.onload = () => {
            const isChatGPT = false;
            const isTeacher = false;
            const selectedGrade = null;
            const beADialog = false;
            iframe.contentWindow.elaastic.initializeEvaluationReaction(isChatGPT, isTeacher, selectedGrade, "Content to report", beADialog, evaluationId)
        }
        iframeTeacher.onload = () => {
            const isChatGPT = true;
            const isTeacher = true;
            const selectedGrade = null;
            const beADialog = false;
            iframeTeacher.contentWindow.elaastic.initializeEvaluationReaction(isChatGPT, isTeacher, selectedGrade, "", beADialog, evaluationId)
        }
        iframeDialog.onload = () => {
            const isChatGPT = false;
            const isTeacher = false;
            const selectedGrade = null;
            const beADialog = true;
            iframeDialog.contentWindow.elaastic.initializeEvaluationReaction(isChatGPT, isTeacher, selectedGrade, "This is a content to report", beADialog, evaluationId)
        }
        window.addEventListener('message', (event) => {
            if (event.data.command === 'grade-submitted_' + evaluationId) {
                const gradeSubmitted = event.data.grade;
                console.log(gradeSubmitted)
            } else if (event.data.command === 'report-submitted_' + evaluationId) {
                const reportReason = event.data.reportReason;
                const reportDetail = event.data.reportDetail;
                console.log(reportReason)
                console.log(reportDetail)
            }
        })

        const optionIframeResiser = {
            license: 'GPLv3',
            waitForLoad: true
        };
        /*[- Init iframe resize. AS we didn't specify one iframe, it will select all -]*/
        iframeResize(optionIframeResiser)
    </script>
</div>
