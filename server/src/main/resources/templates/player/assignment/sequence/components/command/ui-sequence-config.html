<!DOCTYPE html>
<html lang="en" th:replace="layout/vuejs-app :: vueJsAppLayout(title=~{::title}, content=~{::body}, style=~{})"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

    <head>
        <meta charset="UTF-8">
        <title>Sequence Configuration</title>
    </head>

    <body>
    <div id="sequence-configuration-app" class="ui-app">
        <!-- Loader -->
        <div class="loading ui segment">
            <br>
            <br>
        </div>
    </div>
    <script th:inline="javascript">
        const AIExplanationActived = /*[[${IAExplanationIsEnabled}]]*/ false;
        window.elaastic = {
            /**
             * Initialize the sequence configuration Vue app.
             * @param questionIsOpen {boolean} - Indicates if the question is open or not.
             */
            initializeSequenceConfiguration: (questionIsOpen) => {
                const app = Vue.createApp(
                        ElaasticVueComponents.SequenceConfiguration,
                        {
                            maxResponseToEvaluate: 5,
                            aiIsActivated: AIExplanationActived,
                            questionIsOpen,
                            onCancelSequenceConfiguration: () => {
                                window.parent.postMessage({command: 'sequence-configuration-cancelled'}, '*')
                            },
                            onSubmitSequenceConfiguration: (request) => {
                                window.parent.postMessage({
                                    command: 'sequence-configuration-submitted',
                                    request
                                }, '*')
                            }
                        }
                )
                ElaasticVueComponents.registerPlugins(app)
                app.mount(`#sequence-configuration-app`)
            }
        }
    </script>
    </body>
</html>
