<div th:fragment="sequenceConfigVue"
     th:remove="tag"
     xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

    <!--/* script for activating @iframe-resizer that allow us to smoothly integrate the previous iframe within the page layout */-->
    <script src="https://cdn.jsdelivr.net/npm/@iframe-resizer/parent@5.3.2"></script>

    <iframe
            id="sequence-configuration-app"
            class="transparent-iframe"
            th:src="@{/ui/sequence/sequence-configuration}"
            width="100%"
    ></iframe>

    <script th:inline="javascript">
        const iframe = document.getElementById('sequence-configuration-app');


        /*[- Trigger the app init function on iframe loading -]*/
        iframe.onload = () => {
            iframe.contentWindow.elaastic.initializeSequenceConfiguration()
        }

        window.addEventListener('message', (event) => {
            if (event.data.command === 'sequence-configuration-cancelled') {
                console.log(event.data)
            } else if (event.data.command === 'sequence-configuration-submitted') {
                const data = event.data;
                console.log(data)
            }
        })

        const optionIframeResiser = {
            license: 'GPLv3',
            waitForLoad: true
        };
        /*[- Init iframe resize. AS we didn't specify one iframe, it will select all -]*/
        iframeResize(optionIframeResiser)
    </script>
</div>
