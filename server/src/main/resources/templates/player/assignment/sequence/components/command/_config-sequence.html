<!--/* Modal to configure a sequence */-->
<div xmlns:th="http://www.thymeleaf.org"
     xmlns="http://www.w3.org/1999/html"
     th:fragment="configSequence(sequenceId, questionType)"
     th:id="|sequenceSpec_${sequenceId}|"
>

    <iframe
            th:id="|sequenceConfiguration_${sequenceId}|"
            class="transparent-iframe"
            th:src="@{/ui/sequence/configuration}"
            width="100%"
    ></iframe>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <script th:inline="javascript">
        $(function () {
            const iframe = document.getElementById('sequenceConfiguration_' + [[${sequenceId}]]);
            iframe.onload = () => {
                iframe.contentWindow.elaastic.initializeSequenceConfiguration(
                        questionIsOpen = [[${questionType == T(org.elaastic.material.instructional.question.QuestionType).OpenEnded
            }]]
            )
            }

            window.addEventListener('message', (event) => {
                if (event.data.command === 'sequence-configuration-submitted') {
                    const $loadingSegment = $('#loading-sequence_' + [[${commandModel.sequenceId}]]);
                    $loadingSegment.slideDown();
                    // TODO Step 2. Provide the X-CSRF-TOKEN to the UI component, so it will be able to directly communicate with the server without this Thymeleaf intermediation
                    $.ajax({
                        url: '/player/sequence/' + [[${sequenceId}]] + '/start.json',
                        type: 'POST',
                        contentType: 'application/json',
                        headers: {
                            'X-CSRF-TOKEN': $("meta[name='_csrf']").attr("content") || $("input[name='_csrf']").val()
                        },
                        data: JSON.stringify(event.data.request),
                    }).done(function () {
                        window.location.reload();
                    }).fail(function (jqXHR, textStatus, errorThrown) {
                        // Note: we should provide an error message to the user here but it will be much easier to implement it in the UI component once authentication is implemented
                        console.error('Failed to start sequence:', errorThrown);
                    })
                }
                elaastic.closeSequenceConfig([[${sequenceId}]]);
            })

            const optionIframeResiser = {
                license: 'GPLv3',
                waitForLoad: true
            };
            iframeResize(optionIframeResiser, '#sequenceConfiguration_' + [[${sequenceId}]]);
        })
    </script>
</div>
