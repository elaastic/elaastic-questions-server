<!--/* Modal to configure a sequence */-->
<div xmlns:th="http://www.thymeleaf.org"
     xmlns="http://www.w3.org/1999/html"
     th:fragment="configSequence(sequenceId, questionType, previousSequenceConfiguration)"
     th:id="|sequenceSpec_${sequenceId}|"
>
    <!--/*@thymesVar id="sequenceId" type="kotlin.Int"*/-->
    <!--/*@thymesVar id="questionType" type="org.elaastic.material.instructional.question.QuestionType"*/-->
    <!--/*@thymesVar id="previousSequenceConfiguration" type="org.elaastic.sequence.SequenceConfig"*/-->

    <iframe
            th:id="|sequenceConfiguration_${sequenceId}|"
            class="transparent-iframe"
            th:src="@{/ui/sequence/configuration}"
            width="100%"
    ></iframe>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <script th:inline="javascript">
        $(function () {
            const iframe = document.getElementById('sequenceConfiguration_' + [[${sequenceId}]]);
            const questionIsOpen = /*[[${questionType == T(org.elaastic.material.instructional.question.QuestionType).OpenEnded}]]*/ false;
            const previousSequenceConfiguration = /*[[${previousSequenceConfiguration}]]*/ null;
            iframe.onload = () => {
                iframe.contentWindow.elaastic.initializeSequenceConfiguration(
                        questionIsOpen,
                        previousSequenceConfiguration
                )
            }

            window.addEventListener('message', (event) => {
                if (event.data.command === 'start-sequence') {
                    const $loadingSegment = $('#loading-sequence_' + [[${sequenceId}]]);
                    $loadingSegment.slideDown();
                    // TODO Step 2. Provide the X-CSRF-TOKEN to the UI component, so it will be able to directly communicate with the server without this Thymeleaf intermediation
                    elaastic.closeSequenceConfig([[${sequenceId}]]);
                    $.ajax({
                        url: '/player/sequence/' + [[${sequenceId}]] + '/start.json',
                        type: 'POST',
                        contentType: 'application/json',
                        headers: {
                            'X-CSRF-TOKEN': $("meta[name='_csrf']").attr("content") || $("input[name='_csrf']").val()
                        },
                        data: JSON.stringify(event.data.request),
                    }).done(function () {
                        window.location.reload();
                    })
                } else if (event.data.command === 'sequence-configuration-saved') {
                    const $loadingSegment = $('#loading-sequence_' + [[${sequenceId}]]);
                    $loadingSegment.slideDown();
                    // TODO Provide the X-CSRF-TOKEN to the UI component, so it will be able to directly communicate with the server without this Thymeleaf intermediation
                    $.ajax({
                        url: '/player/sequence/' + [[${sequenceId}]] + '/save',
                        type: 'POST',
                        contentType: 'application/json',
                        headers: {
                            'X-CSRF-TOKEN': $("meta[name='_csrf']").attr("content") || $("input[name='_csrf']").val()
                        },
                        data: JSON.stringify(event.data.request),
                    }).done(function () {
                        $loadingSegment.slideUp();
                        elaastic.closeSequenceConfig([[${sequenceId}]]);
                    })
                } else if (event.data.command === 'sequence-configuration-cancelled') {
                    elaastic.closeSequenceConfig([[${sequenceId}]]);
                }

            })

            const optionIframeResiser = {
                license: 'GPLv3',
                waitForLoad: true
            };
            iframeResize(optionIframeResiser, '#sequenceConfiguration_' + [[${sequenceId}]]);
        })
    </script>
</div>
