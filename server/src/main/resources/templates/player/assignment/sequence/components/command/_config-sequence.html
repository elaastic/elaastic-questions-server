<!--/* Modal to configure a sequence */-->
<div xmlns:th="http://www.thymeleaf.org"
     xmlns="http://www.w3.org/1999/html"
     th:fragment="configSequence(sequenceId, statementId, questionType, hasExpectedExplanation)"
     class="ui modal"
     th:id="|sequenceSpec_${sequenceId}|">

    <iframe
            th:id="|sequenceConfiguration_${sequenceId}|"
            class="transparent-iframe"
            th:src="@{/ui/sequence/sequence-configuration}"
            width="100%"
    ></iframe>

    <script th:inline="javascript">
        $(function () {
            let modalId = 'sequenceSpec_' + [[${sequenceId}]]

            const $modalConfigSequence = $('#' + modalId);
            $modalConfigSequence.modal({
                centered: false,
                closable: true,
            })

            $modalConfigSequence.css({'margin-top': '2vh', 'top': 'auto'});

            const iframe = document.getElementById('sequenceConfiguration_' + [[${sequenceId}]]);
            iframe.onload = () => {
                iframe.contentWindow.elaastic.initializeSequenceConfiguration(
                        questionIsOpen = [[${questionType == T(org.elaastic.material.instructional.question.QuestionType).OpenEnded}]]
                )
            }

            window.addEventListener('message', (event) => {
                if (event.data.command === 'sequence-configuration-cancelled') {
                    $modalConfigSequence.modal('hide');
                } else if (event.data.command === 'sequence-configuration-submitted') {
                    const data = event.data.request;

                    $modalConfigSequence.modal('hide');

                    // TODO Step 1. Just send the stringified data to the server (no need to rewrite it ; we should just use the data format within the UI component & the server
                    // TODO Step 2. Provide the X-CSRF-TOKEN to the UI component, so it will be able to directly communicate with the server without this Thymeleaf intermediation
                    $.ajax({
                        // url: ''[['@{/player/sequence/{sequenceId}/start.json(sequenceId=${sequenceId})}]]',
                        url: '/player/sequence/' + [[ ${sequenceId} ]] + '/start.json',
                        type: 'POST',
                        contentType: 'application/json',
                        headers: {
                            'X-CSRF-TOKEN': $("meta[name='_csrf']").attr("content") || $("input[name='_csrf']").val()
                        },
                        data: JSON.stringify(data),
                    }).done(function () {
                        window.location.reload();
                    })
                }
            })

            const optionIframeResiser = {
                license: 'GPLv3',
                waitForLoad: true
            };
            iframeResize(optionIframeResiser, '#sequenceConfiguration_' + [[${sequenceId}]]);
        })
    </script>
</div>
