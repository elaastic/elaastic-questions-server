<!--/* Modal to configure a sequence */-->
<div xmlns:th="http://www.thymeleaf.org"
     xmlns="http://www.w3.org/1999/html"
     th:fragment="configSequence(sequenceId, statementId, questionType, hasExpectedExplanation)"
     class="ui modal long"
     th:id="|sequenceSpec_${sequenceId}|">

    <!--/* Content of the modal */-->
    <div>

        <form class="ui form" th:id="|sequenceSpec_${sequenceId}_form|"
              th:action="@{/player/sequence/{sequenceId}/start(sequenceId=${sequenceId})}">
            <!--/* Hidden input to send the sequence id */-->
            <input name="id" th:value="${sequenceId}" type="hidden">
            <!--/* Execution context */-->
            <input name="executionContext" type="hidden"/>

            <div th:id="|configuration_${sequenceId}|">
                <!--/* Input for if students have to provide an explanation */-->
                <input name="studentsProvideExplanation" type="hidden"/>
                <!--/* Checkbox to enable the evaluation of the student's answers, always true and unchangeable */-->
                <input type="hidden">
                <!--/* Select to set how many answers the students have to evaluate */-->
                <input name="responseToEvaluateCount" type="hidden"/>
                <!--/* Evaluation method */-->
                <input name="evaluationPhaseConfig" type="hidden"/>
                <!--/* ChatGPT evaluation */-->
                <input name="chatGptEvaluation" type="hidden"/>
            </div>
        </form>


    </div>

    <iframe
            th:id="|sequenceConfiguration_${sequenceId}|"
            class="transparent-iframe"
            th:src="@{/ui/sequence/sequence-configuration}"
            width="100%"
    ></iframe>

    <script th:inline="javascript">
        $(function () {
            let modalId = 'sequenceSpec_' + [[${sequenceId}]]

            $('#' + modalId).modal({
                centered: false,
                onApprove: function () {
                    const form = $('#' + modalId + '_form');

                    // A Form serialized is a string like 'key1=value1&key2=value2',
                    // very handy when you send data with a GET request
                    const data = form.serialize();

                    $.get(form.attr('action'), data)
                            .done(function () {
                                window.location.reload();
                            })
                }
            })

            const iframe = document.getElementById('sequenceConfiguration_' + [[${sequenceId}]]);
            iframe.onload = () => {
                iframe.contentWindow.elaastic.initializeSequenceConfiguration()
            }

            window.addEventListener('message', (event) => {
                if (event.data.command === 'sequence-configuration-cancelled') {
                    console.log(event.data)
                } else if (event.data.command === 'sequence-configuration-submitted') {
                    const data = event.data;
                    console.log(data)
                }
            })

            const optionIframeResiser = {
                license: 'GPLv3',
                waitForLoad: true
            };
            iframeResize(optionIframeResiser, '#sequenceConfiguration_' + [[${sequenceId}]]);
        })
    </script>
</div>
