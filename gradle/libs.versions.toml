togglzConsole = { module = "org.togglz:togglz-console", version.ref = "togglz" }
togglzKotlin = { module = "org.togglz:togglz-kotlin", version.ref = "togglz" }
togglzSpringBootStarter = { module = "org.togglz:togglz-spring-boot-starter", version.ref = "togglz" }
togglzSpringSecurity = { module = "org.togglz:togglz-spring-security", version.ref = "togglz" }

[plugins]
kotlinJpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
