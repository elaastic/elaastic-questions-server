[versions]
byteBuddy = "1.15.4"
commonsCsv = "1.5"
commonsIo = "2.22.0"
commonsLang3 = "3.22.0"
cucumber = "7.14.1"
ehcache = "3.6.3"
greenmail = "1.5.10"
gson = "2.8.9"
hamcrestDate = "1.1.0"
jsoup = "1.24.1"
junitPlatformSuite = "1.10.1"
kotlin = "1.6.21"
mockito = "5.14.2"
mockitoKotlin = "2.1.0"
mockk = "1.13.9"
sonarqube = "4.2.1.3168"
springBoot = "2.7.13"
springDependencyManagement = "1.0.15.RELEASE"
springHateoasJsonapi = "1.6.0"
springSecurity = "5.8.3"
thymeleafExtrasTogglz = "1.0.1.RELEASE"
togglz = "3.0.0"

[libraries]
commonsCsv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
commonsIo = { module = "commons-io:commons-io", version.ref = "commonsIo" }
commonsLang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
cucumberJava = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumberJunit = { module = "io.cucumber:cucumber-junit", version.ref = "cucumber" }
cucumberJunitPlatformEngine = { module = "io.cucumber:cucumber-junit-platform-engine", version.ref = "cucumber" }
cucumberSpring = { module = "io.cucumber:cucumber-spring", version.ref = "cucumber" }
ehcache = { module = "org.ehcache:ehcache", version.ref = "ehcache" }
flywayCore = { module = "org.flywaydb:flyway-core" }
flywayMysql = { module = "org.flywaydb:flyway-mysql" }
